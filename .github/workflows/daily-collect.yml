name: Daily Stock Collection

on:
  # 排程已改用 Cloud Run（Cloud Scheduler 台灣 17:00 + 22:00）；此處停用自動排程避免重複收集，
  # 僅保留手動觸發作為備援
  workflow_dispatch:
    inputs:
      date:
        description: '指定日期 (YYYY-MM-DD)，留空則為今日'
        required: false
        type: string
      skip_stock:
        description: '跳過股票資料收集'
        required: false
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create directories
        run: |
          mkdir -p logs
          mkdir -p data/daily_reports/archive
          mkdir -p data/strong_stock_matrix

      - name: Setup Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          echo "$FIREBASE_SERVICE_ACCOUNT" > frontend/service-account.json

      - name: Run daily collector
        env:
          FINMIND_API_TOKEN: ${{ secrets.FINMIND_API_TOKEN }}
          USE_GCS_ARCHIVE: '1'
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            python -m stock_collector.daily_collector --date ${{ inputs.date }}
          elif [ "${{ inputs.skip_stock }}" = "true" ]; then
            python -m stock_collector.daily_collector --skip-stock
          else
            python -m stock_collector.daily_collector
          fi

      - name: Cleanup credentials
        if: always()
        run: |
          rm -f service-account.json
          rm -f frontend/service-account.json

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-logs
          path: logs/
          retention-days: 7
